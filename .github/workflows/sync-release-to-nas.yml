name: Sync Release To Ali

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (e.g. v1.1.7)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ steps.release-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.release-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json tagName,name,body,publishedAt,createdAt,isDraft,isPrerelease \
            > release.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch latest metadata with final release notes
        env:
          RELEASE_JSON_PATH: release.json
          RELEASE_ASSETS_DIR: release-assets
        run: node scripts/sync-release-metadata.js

      - name: Add macOS legacy DMG aliases
        shell: bash
        run: |
          shopt -s nullglob
          for dmg in release-assets/Zen-AI-*-macos-*.dmg; do
            for legacy in "${dmg/Zen-AI-/Zen AI-}" "${dmg/Zen-AI-/Zen.AI-}"; do
              if [ "$legacy" != "$dmg" ] && [ ! -e "$legacy" ]; then
                cp "$dmg" "$legacy"
                echo "Created legacy macOS installer alias: $legacy"
              fi
            done
          done

      - name: Prepare SSH key
        env:
          ALI_SSH_KEY: ${{ secrets.ALI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ALI_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Upload assets to Ali server
        env:
          ALI_SSH_HOST: ${{ secrets.ALI_SSH_HOST }}
          ALI_SSH_PORT: ${{ secrets.ALI_SSH_PORT }}
          ALI_SSH_USER: ${{ secrets.ALI_SSH_USER }}
          ALI_DEPLOY_PATH: ${{ secrets.ALI_DEPLOY_PATH }}
          RELEASE_ASSETS_DIR: release-assets
        run: bash scripts/upload-release-assets.sh
