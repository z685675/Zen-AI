name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
      publish:
        description: "Publish after all platforms and Python runtimes pass (requires platform=all)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ${{ fromJSON(
          github.event_name == 'push' && '["macos-latest", "windows-2022"]' ||
          github.event.inputs.platform == 'all' && '["macos-latest", "windows-2022"]' ||
          github.event.inputs.platform == 'windows' && '["windows-2022"]' ||
          github.event.inputs.platform == 'mac' && '["macos-latest"]' ||
          '["macos-latest", "windows-2022"]'
          ) }}
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Get release tag
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set package.json version
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macos-latest dependencies fix
        if: matrix.os == 'macos-latest'
        run: |
          brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "::warning::Dependency installation failed (attempt $attempt/3). Retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "::error::Dependency installation failed after 3 attempts."
          exit 1

      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          RELEASE_NOTES_FILE="release-notes/${TAG}.md"
          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            RELEASE_NOTES_FILE="release-notes/${VERSION}.md"
          fi
          if [ -f "$RELEASE_NOTES_FILE" ]; then
            cp "$RELEASE_NOTES_FILE" .release-body.md
          else
            git tag -l "$TAG" --format='%(contents)' > .release-body.md
          fi
          if [ ! -s .release-body.md ]; then
            echo "Release notes for $TAG are not provided yet." > .release-body.md
          fi
          {
            echo "RELEASE_TAG=$TAG"
            echo "RELEASE_NOTES_FILE=.release-body.md"
          } >> "$GITHUB_ENV"

      - name: Check Mac packaging links
        if: matrix.os == 'macos-latest'
        run: pnpm exec vitest run --project scripts scripts/__tests__/mac-bundle-links.test.ts scripts/__tests__/opencode-runtime-packaging.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
          fi
          sudo -H pip install setuptools
          pnpm validate:release
          pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Windows
        if: matrix.os == 'windows-2022'
        run: |
          pnpm validate:release
          pnpm exec electron-builder --win --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Verify Mac agent runtimes
        if: matrix.os == 'macos-latest'
        run: |
          node scripts/check-packaged-agent-runtimes.js "dist/mac-arm64/Zen AI.app/Contents/Resources" mac arm64
          node scripts/check-packaged-agent-runtimes.js "dist/mac/Zen AI.app/Contents/Resources" mac x64
          if [ "$(node -p 'process.arch')" = "arm64" ]; then
            MAC_APP_DIR="dist/mac-arm64/Zen AI.app"
          else
            MAC_APP_DIR="dist/mac/Zen AI.app"
          fi
          ELECTRON_RUN_AS_NODE=1 "$MAC_APP_DIR/Contents/MacOS/Zen AI" \
            scripts/check-packaged-runtime-dependencies.js \
            "dist/mac-arm64/Zen AI.app/Contents/Resources/app.asar" \
            "dist/mac/Zen AI.app/Contents/Resources/app.asar"

      - name: Verify Windows agent runtimes
        if: matrix.os == 'windows-2022'
        run: |
          node scripts/check-packaged-agent-runtimes.js "dist/win-unpacked/resources" windows x64
          node scripts/check-packaged-agent-runtimes.js "dist/win-arm64-unpacked/resources" windows arm64

      - name: Verify Windows runtime dependencies
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $process = Start-Process `
            -FilePath "./dist/win-unpacked/Zen AI.exe" `
            -ArgumentList @(
              "scripts/check-packaged-runtime-dependencies.js",
              "dist/win-unpacked/resources/app.asar",
              "dist/win-arm64-unpacked/resources/app.asar"
            ) `
            -NoNewWindow `
            -Wait `
            -PassThru
          exit $process.ExitCode

      - name: Remove macOS legacy aliases before release action
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          shopt -s nullglob
          for dmg in dist/Zen\ AI-*-macos-*.dmg; do
            rm -f "$dmg"
            echo "Removed release-action incompatible alias: $dmg"
          done
          for dmg in dist/Zen.AI-*-macos-*.dmg; do
            if [ -e "$dmg" ]; then
              rm -f "$dmg"
              echo "Removed dotted macOS alias from release-action upload set: $dmg"
            fi
          done

      - name: Preserve exact hotpatch installer baseline
        shell: bash
        env:
          PATCH_PLATFORM: ${{ runner.os == 'Windows' && 'win32' || 'darwin' }}
        run: |
          cp out/main/hotpatch-base.json "dist/hotpatch-base-$PATCH_PLATFORM.json"
          pnpm exec tsx --tsconfig tsconfig.node.json scripts/hotpatch/runtime.ts \
            --mode pack --descriptor "dist/hotpatch-base-$PATCH_PLATFORM.json" \
            --archive "dist/hotpatch-runtime-$PATCH_PLATFORM.zip"

      - name: Release Windows
        if: matrix.os == 'windows-2022'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          bodyFile: .release-body.md
          artifacts: "dist/*.exe,dist/latest*.yml,dist/*.blockmap,dist/hotpatch-base-*.json,dist/hotpatch-runtime-*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Mac
        if: matrix.os == 'macos-latest'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          bodyFile: .release-body.md
          artifacts: "dist/*.zip,dist/*.dmg,dist/latest*.yml,dist/*.blockmap,dist/hotpatch-base-*.json"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS legacy DMG aliases
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for dmg in dist/Zen-AI-*-macos-*.dmg; do
            for legacy in "${dmg/Zen-AI-/Zen AI-}" "${dmg/Zen-AI-/Zen.AI-}"; do
              if [ "$legacy" != "$dmg" ]; then
                cp "$dmg" "$legacy"
                gh release upload "${{ steps.get-tag.outputs.tag }}" "$legacy" \
                  --repo "${{ github.repository }}" \
                  --clobber
                echo "Uploaded legacy macOS installer alias: $legacy"
              fi
            done
          done

  python-runtime:
    needs: release
    uses: ./.github/workflows/build-python-runtime.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  publish:
    needs: [release, python-runtime]
    # Tags only build a draft. Public updates require an explicit manual publish.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.platform == 'all'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Verify complete stable release before publishing
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Non-stable tags remain drafts for explicit review."
            exit 0
          fi
          gh release view "$RELEASE_TAG" --json tagName,body,assets > release-assets.json
          node scripts/verify-release-assets.js release-assets.json "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "Zen AI $RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

  sync-downloads:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/sync-release-to-nas.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
