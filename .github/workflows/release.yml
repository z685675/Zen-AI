name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ${{ fromJSON(
          github.event_name == 'push' && '["macos-latest", "windows-latest"]' ||
          github.event.inputs.platform == 'all' && '["macos-latest", "windows-latest"]' ||
          github.event.inputs.platform == 'windows' && '["windows-latest"]' ||
          github.event.inputs.platform == 'mac' && '["macos-latest"]' ||
          '["macos-latest", "windows-latest"]'
          ) }}
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get release tag
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set package.json version
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macos-latest dependencies fix
        if: matrix.os == 'macos-latest'
        run: |
          brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          RELEASE_NOTES_FILE="release-notes/${TAG}.md"
          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            RELEASE_NOTES_FILE="release-notes/${VERSION}.md"
          fi
          if [ -f "$RELEASE_NOTES_FILE" ]; then
            cp "$RELEASE_NOTES_FILE" .release-body.md
          else
            git tag -l "$TAG" --format='%(contents)' > .release-body.md
          fi
          if [ ! -s .release-body.md ]; then
            echo "Release notes for $TAG are not provided yet." > .release-body.md
          fi
          {
            echo "RELEASE_TAG=$TAG"
            echo "RELEASE_NOTES_FILE=.release-body.md"
          } >> "$GITHUB_ENV"

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
          fi
          sudo -H pip install setuptools
          pnpm validate:release
          pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          pnpm validate:release
          pnpm exec electron-builder --win --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Remove macOS legacy aliases before release action
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          shopt -s nullglob
          for dmg in dist/Zen\ AI-*-macos-*.dmg; do
            rm -f "$dmg"
            echo "Removed release-action incompatible alias: $dmg"
          done
          for dmg in dist/Zen.AI-*-macos-*.dmg; do
            if [ -e "$dmg" ]; then
              rm -f "$dmg"
              echo "Removed dotted macOS alias from release-action upload set: $dmg"
            fi
          done

      - name: Release Windows
        if: matrix.os == 'windows-latest'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          bodyFile: .release-body.md
          artifacts: "dist/*.exe,dist/latest*.yml,dist/*.blockmap"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Mac
        if: matrix.os == 'macos-latest'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          bodyFile: .release-body.md
          artifacts: "dist/*.zip,dist/*.dmg,dist/latest*.yml,dist/*.blockmap"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS legacy DMG aliases
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for dmg in dist/Zen-AI-*-macos-*.dmg; do
            for legacy in "${dmg/Zen-AI-/Zen AI-}" "${dmg/Zen-AI-/Zen.AI-}"; do
              if [ "$legacy" != "$dmg" ]; then
                cp "$dmg" "$legacy"
                gh release upload "${{ steps.get-tag.outputs.tag }}" "$legacy" \
                  --repo "${{ github.repository }}" \
                  --clobber
                echo "Uploaded legacy macOS installer alias: $legacy"
              fi
            done
          done
