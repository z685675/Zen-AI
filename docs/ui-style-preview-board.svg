    <style>
      .font { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #1d2a3c; }
      .sub { font-size: 16px; fill: #6d7d91; }
      .cardTitle { font-size: 21px; font-weight: 700; fill: #213047; }
      .cardSub { font-size: 14px; fill: #8090a3; }
      .tiny { font-size: 10px; }
      .mini { font-size: 11px; }
      .small { font-size: 12px; }
      .label { font-size: 13px; font-weight: 600; }
    </style>
